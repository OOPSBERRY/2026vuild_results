<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>위로가 필요한 날 : 고요한 나의 책상</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro">

  <!-- 3D 방 -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 책상 위 물건 위에 얹히는 큰 버튼들 (위치는 3D에서 자동 계산) -->
  <section class="objects" id="objects" aria-label="책상 위 물건들">
    <a id="nbOpen" class="nb-open" target="_blank" rel="noopener" aria-label="이 프로그램 열어 보기"></a>
  </section>

  <main class="stage">
    <header class="title">
      <p class="title-small">위로가 필요한 날 :</p>
      <h1>고요한 나의 책상</h1>
    </header>

  </main>

  <!-- 처음 장면: 앉기 버튼 (의자는 3D 안에 있어요) -->
  <div class="intro-ui" id="introUi">
    <button class="sit-btn" id="sitBtn" type="button">의자에 앉기</button>
  </div>

  <script src="three.min.js"></script>
  <script src="links.js"></script>
  <script src="scene.js"></script>
  <script src="script.js"></script>
</body>
</html>
